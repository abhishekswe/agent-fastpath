    - generic [ref=e329]:
      - generic [ref=e330]: Security
      - heading "Safe by default" [level=2] [ref=e331]
      - paragraph [ref=e332]: Tool inputs, logs, and web pages can be hostile. You set the limits; tool callers can tighten them but never loosen them.
      - generic [ref=e333]:
        - generic [ref=e334]:
          - generic [ref=e335]: SSRF blocking
          - generic [ref=e336]: The browser cannot reach localhost, private networks, or cloud metadata endpoints such as 169.254.169.254. Every connection, including redirects and page scripts, goes through a checking proxy.
        - generic [ref=e337]:
          - generic [ref=e338]: Irreversible-action gate
          - generic [ref=e339]:
            - text: Elements labelled like delete, pay, checkout, publish, deploy, or merge are flagged. The browser will not click them unless the call sets
            - code [ref=e340]: "allowIrreversible: true"
            - text: .
        - generic [ref=e341]:
          - generic [ref=e342]: Bounded file reads
          - generic [ref=e343]: Triage reads only inside the directories you allow, after resolving symlinks, and at most 64 KB per file.
        - generic [ref=e344]:
          - generic [ref=e345]: Secret redaction
          - generic [ref=e346]: TypeSafe, Anthropic, OpenAI, GitHub, AWS, and Slack keys, private keys, bearer tokens, and password fields are redacted before semantic requests and traces.
      - paragraph [ref=e347]:
        - text: Details in the
        - link "security model" [ref=e348] [cursor=pointer]:
          - /url: https://github.com/abhishekswe/agent-fastpath/blob/main/docs/security.md
        - text: . Report vulnerabilities privately through
        - link "GitHub security advisories" [ref=e349] [cursor=pointer]:
          - /url: https://github.com/abhishekswe/agent-fastpath/security/advisories/new
        - text: .
