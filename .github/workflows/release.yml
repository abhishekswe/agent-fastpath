name: Release

# Publishes to npm when a version tag (v*) is pushed. The npm-publish
# environment requires maintainer approval before this job runs.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Version is not already published
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "agent-fastpath@$VERSION" version >/dev/null 2>&1; then
            echo "agent-fastpath@$VERSION is already on npm. Bump the version before tagging."
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm publish --provenance --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
